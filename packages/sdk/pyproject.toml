[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Published as "agentscope-trace": "agentscope" and "agentscope-sdk" on PyPI
# belong to unrelated projects (#274). The import package is `agentscope_trace`
# (#297); see [tool.setuptools] for the deprecated `agentscope` shim.
name = "agentscope-trace"
dynamic = ["version"]
description = "Lightweight tracing SDK for the AgentScope observability dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "websockets>=16.1.1",
    "pydantic>=2.9",
]

[project.urls]
Homepage = "https://github.com/PxA-Labs/AgentsScope"
Repository = "https://github.com/PxA-Labs/AgentsScope"
Issues = "https://github.com/PxA-Labs/AgentsScope/issues"
Changelog = "https://github.com/PxA-Labs/AgentsScope/blob/main/CHANGELOG.md"

[project.scripts]
# The command keeps its name; only the module path moved (#297).
agentscope = "agentscope_trace.cli:main"

[project.optional-dependencies]
langchain = [
    "langchain-core>=1.7.6",
]
tiktoken = [
    "tiktoken>=0.14.0",
]
autogen = [
    "autogen-agentchat>=0.7.5",
    "autogen-core>=0.7.5",
]
llamaindex = [
    "llama-index-core>=0.14.26",
]
anthropic = [
    "anthropic>=2.8.0",
]
gemini = [
    "google-genai>=3.3.0",
]
crewai = [
    # started_event_id / parent_event_id on events are required by the listener.
    "crewai>=1.15.41",
]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "black>=26.10.1",
    "ruff>=0.17.5",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.setuptools]
packages = [
    "agentscope_trace",
    "agentscope_trace.integrations",
    "agentscope_trace.providers",
    # Deprecated alias for `agentscope_trace` (agentscope/__init__.py only).
    # It is the one path that still clashes with agentscope-ai's `agentscope`
    # package on PyPI; remove it after at least one minor release (#297).
    "agentscope",
]

[tool.setuptools.dynamic]
version = { attr = "agentscope_trace._version.__version__" }

[tool.setuptools.package-data]
agentscope_trace = ["pricing.json"]





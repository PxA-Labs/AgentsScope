# Dependabot configuration for AgentScope
# See: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci/cd"
    groups:
      # All github/codeql-action/* steps must run the same release, so they
      # are bumped together in a single PR instead of one PR per sub-action.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # Python SDK (pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/packages/sdk"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # The SDK is a library: only raise a dependency's lower bound when the
    # current range no longer allows the new release. Bumping floors to the
    # latest version (e.g. pydantic>=2.14.3) makes the SDK uninstallable next
    # to frameworks that pin older versions, such as CrewAI (pydantic<2.13).
    versioning-strategy: increase-if-necessary
    labels:
      - "dependencies"
      - "pkg: sdk"

  # Python Server (requirements.txt / requirements-dev.txt)
  - package-ecosystem: "pip"
    directory: "/packages/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "pkg: server"

  # Next.js UI (package.json / package-lock.json)
  - package-ecosystem: "npm"
    directory: "/packages/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "pkg: ui"
    groups:
      # eslint and eslint-config-next must move together (#260 and #263 each
      # bumped one side and failed with ERESOLVE).
      eslint:
        patterns:
          - "eslint"
          - "eslint-config-next"
          - "@typescript-eslint/*"
          - "typescript-eslint"
      # @tailwindcss/postcss pins tailwindcss to its exact version, so bumping
      # one without the other installs two Tailwind copies.
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
    ignore:
      # eslint-config-next 16 pulls in eslint-plugin-react, eslint-plugin-import
      # and eslint-plugin-jsx-a11y, which only declare peer support up to
      # ESLint 9. Drop this once they support ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # The group above only helps when both sides get a minor/patch bump. A
      # major of eslint-config-next can require a new ESLint major (16 needed
      # ESLint 9), so it would arrive alone and fail the same way. Bump majors
      # of this pair together by hand.
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      # Tailwind majors change the config format and default styles, so a
      # version bump alone fails the build (#321) or silently changes the look.
      # Migrate by hand with @tailwindcss/upgrade and a visual check (#330).
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/*"
        update-types: ["version-update:semver-major"]

  # Server Docker image
  - package-ecosystem: "docker"
    directory: "/packages/server"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "area: docker"

  # UI Docker image
  - package-ecosystem: "docker"
    directory: "/packages/ui"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "area: docker"

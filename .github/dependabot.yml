# Dependabot configuration for AgentScope
# See: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci/cd"

  # Python SDK (pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/packages/sdk"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "pkg: sdk"

  # Python Server (requirements.txt / requirements-dev.txt)
  - package-ecosystem: "pip"
    directory: "/packages/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "pkg: server"

  # Next.js UI (package.json / package-lock.json)
  - package-ecosystem: "npm"
    directory: "/packages/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "pkg: ui"
    groups:
      # eslint and eslint-config-next must move together (#260 and #263 each
      # bumped one side and failed with ERESOLVE).
      eslint:
        patterns:
          - "eslint"
          - "eslint-config-next"
          - "@typescript-eslint/*"
          - "typescript-eslint"
    ignore:
      # eslint-config-next 16 pulls in eslint-plugin-react, eslint-plugin-import
      # and eslint-plugin-jsx-a11y, which only declare peer support up to
      # ESLint 9. Drop this once they support ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # Server Docker image
  - package-ecosystem: "docker"
    directory: "/packages/server"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "area: docker"

  # UI Docker image
  - package-ecosystem: "docker"
    directory: "/packages/ui"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "area: docker"

# OpenSSF Scorecard Security Analysis
# See: https://github.com/ossf/scorecard-action#scorecard-action
# Scorecard assesses open-source projects for security risks and supply chain best practices.

name: OpenSSF Scorecard

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

# Declare default permissions as read only
permissions: read-all

jobs:
  analysis:
    name: Scorecard Security Analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to code scanning dashboard
      security-events: write
      # Needed to publish results to OpenSSF Scorecard API
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard Analysis
        uses: ossf/scorecard-action@62b2cac7ed8198b15735db800459828253a1b017 # v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          # Public repositories can publish results to OpenSSF REST API
          publish_results: true

      - name: Upload Scorecard Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: OpenSSF Scorecard Report
          path: results.sarif
          retention-days: 14

      - name: Upload to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif

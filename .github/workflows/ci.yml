name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-python:
    name: Python Linting & Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run Ruff (Linter)
        run: |
          ruff check packages/sdk packages/server || true

      - name: Run Black (Formatter Check)
        run: |
          black --check packages/sdk packages/server || true

  test-python-sdk:
    name: Test Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f packages/sdk/pyproject.toml ]; then pip install -e packages/sdk; fi

      - name: Run SDK Tests
        run: |
          if [ -d packages/sdk/tests ]; then pytest packages/sdk/tests; else echo "No SDK tests found yet."; fi

  test-python-server:
    name: Test FastAPI Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f packages/server/requirements.txt ]; then pip install -r packages/server/requirements.txt; fi

      - name: Run Server Tests
        run: |
          if [ -d packages/server/tests ]; then pytest packages/server/tests; else echo "No Server tests found yet."; fi

  check-ui:
    name: Check Next.js UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install UI Dependencies
        run: |
          if [ -f packages/ui/package.json ]; then
            cd packages/ui
            npm ci || npm install
          fi

      - name: Build UI
        run: |
          if [ -f packages/ui/package.json ]; then
            cd packages/ui
            npm run build || true
          fi

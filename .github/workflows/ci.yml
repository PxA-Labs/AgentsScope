name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# OpenSSF Principle of Least Privilege: default permissions restricted to read-only
permissions:
  contents: read

jobs:
  lint-python:
    name: Python Linting & Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run Ruff (Linter & Security Rules)
        run: |
          ruff check .

      - name: Run Black (Formatter Check)
        run: |
          black --check .

  test-python-sdk:
    name: Test Python SDK (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Keep the lowest entry in sync with requires-python in packages/sdk/pyproject.toml.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f packages/sdk/pyproject.toml ]; then pip install -e "packages/sdk[dev,langchain,anthropic,gemini,autogen]" autogen-ext; fi

      - name: Run SDK Tests
        run: |
          if [ -d packages/sdk/tests ]; then pytest packages/sdk/tests; else echo "No SDK tests found yet."; fi

  test-crewai-integration:
    name: Test CrewAI Integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CREWAI_DISABLE_TELEMETRY: "true"
      OTEL_SDK_DISABLED: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # CrewAI pulls in a large dependency tree, so it gets its own job instead
      # of slowing down the main SDK test job.
      - name: Install SDK with CrewAI
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/sdk[dev,crewai]"

      - name: Run CrewAI tests
        run: |
          pytest packages/sdk/tests/test_crewai_mapper.py packages/sdk/tests/test_crewai_integration.py

  test-llamaindex-integration:
    name: Test LlamaIndex Integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Separate job so the LlamaIndex dependency tree stays out of the main SDK job.
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install SDK with LlamaIndex
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/sdk[dev,llamaindex]"

      - name: Run LlamaIndex tests
        run: |
          pytest packages/sdk/tests/test_llamaindex_mapper.py packages/sdk/tests/test_llamaindex_integration.py

  test-sdk-wheel:
    name: Test SDK wheel install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install SDK test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/sdk[dev]"

      # Builds the wheel, installs it into fresh virtualenvs and checks both
      # import names, the CLI and the clash with agentscope-ai's package (#297).
      - name: Run wheel install tests
        env:
          AGENTSCOPE_WHEEL_TESTS: "1"
        run: |
          pytest packages/sdk/tests/test_wheel_install.py -v

  test-python-server:
    name: Test FastAPI Server (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Keep the lowest entry in sync with requires-python in packages/sdk/pyproject.toml.
        # 3.14 is what the server Docker image (python:3.14-slim) runs.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -d packages/sdk ]; then pip install -e packages/sdk; fi
          if [ -f packages/server/requirements.txt ]; then pip install -r packages/server/requirements.txt; fi
          if [ -f packages/server/requirements-dev.txt ]; then pip install -r packages/server/requirements-dev.txt; fi

      - name: Run Server Tests
        run: |
          if [ -d packages/server/tests ]; then pytest packages/server/tests; else echo "No Server tests found yet."; fi

  test-scripts:
    name: Test Automation Scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Run Script Tests
        run: |
          if [ -d .github/scripts/tests ]; then pytest .github/scripts/tests; fi

  check-ui:
    name: Check Next.js UI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Install UI Dependencies
        run: |
          if [ -f packages/ui/package.json ]; then
            cd packages/ui
            npm ci || npm install --legacy-peer-deps
          fi

      - name: Lint UI
        run: |
          if [ -f packages/ui/package.json ]; then
            cd packages/ui
            npm run lint
          fi

      - name: Build UI
        run: |
          if [ -f packages/ui/package.json ]; then
            cd packages/ui
            npm run build
          fi

  test-ui:
    name: Test Next.js UI (unit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Vitest 5, jsdom and msw need Node 22+.
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/ui/package-lock.json

      - name: Install UI Dependencies
        run: npm ci

      - name: Type-check UI
        run: npx tsc --noEmit

      - name: Run unit tests with coverage
        # Fails below 60% line coverage on store/ and lib/ (vitest.config.mts).
        run: npm run test:coverage

  e2e-ui:
    name: UI E2E Smoke Test (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/server/requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/ui/package-lock.json

      - name: Install Server Dependencies
        working-directory: packages/server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install UI Dependencies
        run: npm ci

      # Only Chromium's headless shell, to keep the job short.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run E2E smoke test
        # Starts the FastAPI server (temp SQLite DB) and `next build && next start`.
        env:
          E2E_PYTHON: python
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            packages/ui/playwright-report/
            packages/ui/test-results/
          retention-days: 7

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# OpenSSF Principle of Least Privilege: default permissions restricted to read-only
permissions:
  contents: read

jobs:
  lint-python:
    name: Python Linting & Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.10
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.10"

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run Ruff (Linter & Security Rules)
        run: |
          ruff check .

      - name: Run Black (Formatter Check)
        run: |
          black --check .

  test-python-sdk:
    name: Test Python SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.10
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f packages/sdk/pyproject.toml ]; then pip install -e "packages/sdk[dev,langchain]"; fi

      - name: Run SDK Tests
        run: |
          if [ -d packages/sdk/tests ]; then pytest packages/sdk/tests; else echo "No SDK tests found yet."; fi

  test-python-server:
    name: Test FastAPI Server
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.10
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -d packages/sdk ]; then pip install -e packages/sdk; fi
          if [ -f packages/server/requirements.txt ]; then pip install -r packages/server/requirements.txt; fi
          if [ -f packages/server/requirements-dev.txt ]; then pip install -r packages/server/requirements-dev.txt; fi

      - name: Run Server Tests
        run: |
          if [ -d packages/server/tests ]; then pytest packages/server/tests; else echo "No Server tests found yet."; fi

  test-scripts:
    name: Test Automation Scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.10
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Script Tests
        run: |
          if [ -d .github/scripts/tests ]; then pytest .github/scripts/tests; fi

  check-ui:
    name: Check Next.js UI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install UI Dependencies
        run: |
          if [ -f packages/ui/package.json ]; then
            cd packages/ui
            npm ci || npm install --legacy-peer-deps
          fi

      - name: Lint UI
        run: |
          if [ -f packages/ui/package.json ]; then
            cd packages/ui
            npm run lint
          fi

      - name: Build UI
        run: |
          if [ -f packages/ui/package.json ]; then
            cd packages/ui
            npm run build
          fi

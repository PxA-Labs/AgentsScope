name: Benchmarks

# Full benchmarks are slow and noisy on shared runners, so they run weekly and
# on demand rather than on every PR. The per-PR regression gate lives in
# packages/sdk/tests/test_performance.py.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install server and SDK
        run: |
          python -m pip install --upgrade pip
          pip install -r packages/server/requirements.txt
          pip install -e packages/sdk

      - name: Run benchmarks
        # pipefail: without it the step takes tee's exit status, so a crashed
        # benchmark would still pass.
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# AgentScope benchmarks ($(date -u +%Y-%m-%dT%H:%MZ), ${GITHUB_SHA::7})"
            make bench
          } 2>&1 | tee benchmark-results.md
          cat benchmark-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: benchmark-results.md
          retention-days: 90

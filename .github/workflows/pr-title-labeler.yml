name: PR Title & Conventional Commit Labeler

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label-pr-title:
    name: Auto Label PR by Conventional Title
    runs-on: ubuntu-latest
    steps:
      - name: Add Conventional Commit Labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title.trim().toLowerCase();

            const typeMap = {
              'feat': { name: 'type: feature', color: 'a2eeef' },
              'fix': { name: 'type: bugfix', color: 'd73a4a' },
              'docs': { name: 'type: docs', color: '0075ca' },
              'refactor': { name: 'type: refactor', color: 'cfd3d7' },
              'test': { name: 'type: test', color: 'bfd4f2' },
              'chore': { name: 'type: chore', color: 'fef2c0' },
              'perf': { name: 'type: performance', color: 'd4c5f9' }
            };

            const match = title.match(/^([a-z]+)(\([^)]+\))?:/);
            if (!match) {
              console.log('PR title does not follow Conventional Commits format.');
              return;
            }

            const prefix = match[1];
            if (typeMap[prefix]) {
              const labelConfig = typeMap[prefix];
              
              // Ensure label exists in repo
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelConfig.name
                });
              } catch (e) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelConfig.name,
                  color: labelConfig.color,
                  description: `Pull requests of type ${prefix}`
                });
              }

              // Add label to PR
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [labelConfig.name]
              });
              
              console.log(`Added label "${labelConfig.name}" to PR #${pr.number}`);
            }

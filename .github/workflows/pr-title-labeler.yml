name: PR Title & Conventional Commit Labeler

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label-pr-title:
    name: Auto Label PR by Conventional Title & Scope
    runs-on: ubuntu-latest
    steps:
      - name: Add Conventional Commit & Scope Labels
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title.trim();

            const typeMap = {
              'feat': { name: 'type: feature', color: 'a2eeef' },
              'fix': { name: 'type: bugfix', color: 'd73a4a' },
              'docs': { name: 'type: docs', color: '0075ca' },
              'refactor': { name: 'type: refactor', color: 'cfd3d7' },
              'test': { name: 'type: test', color: 'bfd4f2' },
              'chore': { name: 'type: chore', color: 'fef2c0' },
              'perf': { name: 'type: performance', color: 'd4c5f9' },
              'style': { name: 'type: style', color: 'ebd77f' },
              'ci': { name: 'type: ci', color: '0e8a16' },
              'build': { name: 'type: build', color: 'fbca04' }
            };

            const scopeMap = {
              'sdk': { name: 'pkg: sdk', color: '1d76db' },
              'server': { name: 'pkg: server', color: '0052cc' },
              'ui': { name: 'pkg: ui', color: '5319e7' },
              'graph': { name: 'area: ui/graph', color: 'b60205' },
              'feed': { name: 'area: ui/event-feed', color: '0e8a16' },
              'inspector': { name: 'area: ui/inspector', color: 'fbca04' },
              'analytics': { name: 'area: ui/analytics', color: '1d76db' },
              'ws': { name: 'area: server/websocket', color: '006b75' },
              'api': { name: 'area: server/api', color: 'd4c5f9' },
              'db': { name: 'area: server/database', color: 'bfd4f2' },
              'langchain': { name: 'area: sdk/langchain', color: 'c2e0c6' },
              'docker': { name: 'area: docker', color: 'fef2c0' }
            };

            const match = title.match(/^([a-zA-Z]+)(?:\(([^)]+)\))?:/);
            if (!match) {
              console.log('PR title does not follow Conventional Commits format.');
              return;
            }

            const prefix = match[1].toLowerCase();
            const scope = match[2] ? match[2].toLowerCase() : null;

            const labelsToAdd = [];

            if (typeMap[prefix]) {
              labelsToAdd.push(typeMap[prefix]);
            }

            if (scope && scopeMap[scope]) {
              labelsToAdd.push(scopeMap[scope]);
            }

            for (const labelConfig of labelsToAdd) {
              // Ensure label exists in repo
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelConfig.name
                });
              } catch (e) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelConfig.name,
                  color: labelConfig.color,
                  description: `Auto-generated label for ${labelConfig.name}`
                });
              }

              // Add label to PR
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [labelConfig.name]
              });
              
              console.log(`Added label "${labelConfig.name}" to PR #${pr.number}`);
            }

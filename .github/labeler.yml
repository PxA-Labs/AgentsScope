# Configuration for actions/labeler

'pkg: sdk':
  - changed-files:
      - any-glob-to-any-file: 'packages/sdk/**/*'

'pkg: server':
  - changed-files:
      - any-glob-to-any-file: 'packages/server/**/*'

'pkg: ui':
  - changed-files:
      - any-glob-to-any-file: 'packages/ui/**/*'

'documentation':
  - changed-files:
      - any-glob-to-any-file:
          - 'README.md'
          - 'CONTRIBUTING.md'
          - 'LICENSE'
          - 'docs/**/*'

'ci/cd':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**/*'
          - 'docker-compose.yml'
          - 'Makefile'

'dependencies':
  - changed-files:
      - any-glob-to-any-file:
          - '**/requirements.txt'
          - '**/package.json'
          - '**/package-lock.json'
          - '**/pyproject.toml'
